<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>KB E2E Test</title>
<style>
  body { margin: 0; font-family: "Segoe UI", sans-serif; width: 420px; height: 640px; overflow: hidden; position: relative; background: #fff; }
  .bar-btn { width: 28px; height: 28px; border: none; border-radius: 7px; background: transparent; cursor: pointer; color: #7a7f86; font-size: 15px; }
  .manage-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #ececec; }
  .manage-head h2 { font-size: 14px; margin: 0; flex: 1; }
  .manage-head .btn-text { border: none; background: none; color: #7a7f86; cursor: pointer; font-size: 12px; padding: 4px 6px; border-radius: 6px; }
  .row-btn { border: none; background: none; cursor: pointer; color: #9aa0a6; font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 8px); background: rgba(28,31,35,.92); color: #fff; font-size: 12px; padding: 8px 14px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: 80%; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @keyframes row-in { from { opacity: 0; transform: translateX(8px); } }
  @keyframes row-out { to { opacity: 0; transform: translateX(16px); } }
  @keyframes pop-in { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes manage-in { from { opacity: 0; transform: translateY(14px) scale(0.99); } }
</style>
<!-- 复用 sidepanel KB 全部样式（从 index.html 同步维护的独立副本，仅测 KB 部分） -->
<style>
  #kb { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; background: #fff; }
  #kb.show { display: flex; animation: manage-in 0.22s; }
  .kb-layout { flex: 1; display: flex; min-height: 0; }
  #kb-projects { flex: none; width: 116px; border-right: 1px solid #f0f0f0; overflow-y: auto; padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; }
  .kb-proj { display: flex; align-items: center; gap: 7px; border: none; background: none; border-radius: 9px; padding: 7px 8px; cursor: pointer; font-size: 12px; color: #3c4043; text-align: left; animation: row-in 0.25s both; }
  .kb-proj:hover { background: #f2f3f5; }
  .kb-proj.current { background: #e3edfd; color: #174ea6; font-weight: 600; }
  .kb-proj.kb-proj-drop { outline: 2px dashed #4285f4; outline-offset: -2px; background: #e3edfd; color: #174ea6; }
  .kb-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .kb-proj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kb-count { flex: none; font-size: 10px; color: #9aa0a6; background: #f2f3f5; border-radius: 999px; padding: 1px 6px; }
  .kb-right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .kb-search-wrap { flex: none; padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
  #kb-search { width: 100%; box-sizing: border-box; border: 1px solid #dcdfe3; border-radius: 9px; padding: 7px 11px; font-size: 13px; outline: none; }
  #kb-cards { flex: 1; overflow-y: auto; padding: 8px 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .kb-empty { text-align: center; color: #9aa0a6; font-size: 13px; padding: 56px 20px; line-height: 1.8; white-space: pre-line; }
  .kb-empty .kb-empty-icon { display: block; margin: 0 auto 10px; width: 34px; height: 34px; color: #d3d7dd; }
  .kb-card::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, #4285f4, #6b9dfa); opacity: 0; transition: opacity .15s; }
  .kb-card:hover::before { opacity: 1; }
  #kb-projects { background: #fafbfc; }
  .kb-card { display: flex; gap: 10px; padding: 10px 11px; border: 1px solid #ececec; border-radius: 12px; cursor: pointer; position: relative; transition: border-color .15s, box-shadow .15s; animation: row-in 0.25s both; }
  .kb-card:hover { border-color: #d5e3fb; box-shadow: 0 4px 14px rgba(66,133,244,.1); }
  .kb-card.removing { animation: row-out 0.18s both; }
  .kb-card-thumb { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; flex: none; background: #f2f3f5; }
  .kb-card-body { flex: 1; min-width: 0; }
  .kb-card-title { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .kb-card-preview { font-size: 11px; color: #7a7f86; margin-top: 2px; }
  .kb-card-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 10px; color: #9aa0a6; }
  .kb-card-meta span:first-child { background: #eef1f5; border-radius: 999px; padding: 1px 7px; color: #5f6368; }
  .kb-card-ops { position: absolute; top: 6px; right: 6px; display: none; gap: 2px; background: rgba(255,255,255,.94); border-radius: 8px; padding: 2px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  .kb-card:hover .kb-card-ops { display: flex; }
  .kb-card-ops button { border: none; background: none; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 12px; color: #5f6368; }
  #kb-detail { position: absolute; inset: 0; z-index: 25; background: #fff; display: none; flex-direction: column; }
  #kb-detail.show { display: flex; }
  .kb-detail-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #ececec; }
  #kb-detail-title { font-size: 14px; font-weight: 600; flex: 1; }
  #kb-detail-meta { font-size: 10px; color: #9aa0a6; display: flex; align-items: center; gap: 4px; }
  .kb-time-pill { display: inline-flex; align-items: center; background: #eef1f5; border-radius: 999px; padding: 2px 8px; font-size: 10px; line-height: 1.4; color: #5f6368; font-weight: 500; white-space: nowrap; }
  #kb-detail-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; font-size: 13px; line-height: 1.75; }
  #kb-detail-body .kb-p { margin: 0 0 10px; white-space: pre-wrap; }
  #kb-detail-body .kb-code { background: #f6f8fa; border: 1px solid #ececec; border-radius: 10px; padding: 10px 12px; font-family: monospace; font-size: 12px; margin: 0 0 10px; white-space: pre; }
  #kb-detail-body .kb-img { max-width: 100%; border-radius: 10px; cursor: zoom-in; margin: 0 0 10px; display: block; }
  .kb-src-link { font-size: 12px; color: #4285f4; }
  #kb-detail-body .kb-refs-head { margin: 20px 0 8px; padding-top: 14px; border-top: 1px solid #eceef1; font-size: 12px; font-weight: 600; color: #5f6368; }
  #kb-detail-body .kb-refs { display: flex; flex-direction: column; gap: 6px; }
  #kb-detail-body .kb-ref-item { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: #f8f9fa; border: 1px solid #eceef1; border-radius: 10px; text-decoration: none; cursor: pointer; }
  #kb-detail-body .kb-ref-item:hover { background: #f0f4fb; border-color: #d5e3fb; }
  #kb-detail-body .kb-ref-title { font-size: 12px; color: #1a1d23; line-height: 1.45; word-break: break-word; }
  #kb-detail-body .kb-ref-url { font-size: 10px; color: #9aa0a6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 拖拽/角标/详情导航/灯箱（与 index.html 同步） */
  .kb-grip { position: absolute; left: 3px; top: 50%; transform: translateY(-50%); color: #c4c8ce; opacity: 0; transition: opacity .15s; cursor: grab; display: flex; align-items: center; padding: 4px 1px; }
  .kb-card:hover .kb-grip { opacity: 1; }
  .kb-grip:active { cursor: grabbing; }
  .kb-card.dragging { opacity: 0.45; border-style: dashed; }
  .kb-card.kb-drop-above::after, .kb-card.kb-drop-below::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 2px; background: #4285f4; box-shadow: 0 0 0 2px rgba(66,133,244,.18); pointer-events: none; }
  .kb-card.kb-drop-above::after { top: -5px; }
  .kb-card.kb-drop-below::after { bottom: -5px; }
  .kb-img-badge { position: absolute; left: 70px; bottom: 8px; display: flex; align-items: center; gap: 3px; font-size: 10px; color: #5f6368; background: rgba(242,243,245,.92); border-radius: 999px; padding: 2px 7px; pointer-events: none; }
  .kb-img-badge svg { display: block; }
  .kb-detail-nav { border: none; background: none; width: 26px; height: 26px; border-radius: 7px; cursor: pointer; color: #7a7f86; display: flex; align-items: center; justify-content: center; flex: none; transition: background .12s, color .12s; }
  .kb-detail-nav:hover { background: #f2f3f5; color: #1c1f23; }
  .kb-lightbox { position: fixed; inset: 0; z-index: 70; background: rgba(20,22,26,.82); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .kb-lightbox img { max-width: 92%; max-height: 88%; border-radius: 8px; box-shadow: 0 18px 60px rgba(0,0,0,.45); cursor: default; background: #fff; }
  .kb-lb-close { position: absolute; top: 14px; right: 14px; border: none; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .kb-lb-nav { position: absolute; top: 50%; transform: translateY(-50%); border: none; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .kb-lb-nav.prev { left: 16px; }
  .kb-lb-nav.next { right: 16px; }
  .kb-lb-counter { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,.85); user-select: none; }
</style>
</head>
<body>
  <div style="display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid #ececec">
    <button class="bar-btn" id="kb-btn" title="知识库"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.5h7.5a1 1 0 0 1 1 1V13a.9.9 0 0 0 .9.9H4a1.5 1.5 0 0 1-1.5-1.5V3a.5.5 0 0 1 .5-.5z"/><path d="M11.5 13.9H12a1.5 1.5 0 0 0 1.5-1.5V5.5H8.75"/><path d="M5.2 5.6h3.4M5.2 8.2h3.4"/></svg></button>
  </div>
  <div style="position:absolute;inset:49px 0 0 0">
    <div id="kb">
      <div class="manage-head">
        <h2 id="kb-title">知识库</h2>
        <button class="btn-text" id="kb-new-project">＋ 项目</button>
        <button class="btn-text" id="kb-close">完成</button>
      </div>
      <div class="kb-layout">
        <div id="kb-projects"></div>
        <div class="kb-right">
          <div class="kb-search-wrap"><input id="kb-search" placeholder="搜索…" /></div>
          <div id="kb-cards"></div>
        </div>
      </div>
      <div id="kb-detail">
        <div class="kb-detail-head">
          <div id="kb-detail-title"></div>

            <span id="kb-detail-meta"></span>

          </div>
        </div>
        <div id="kb-detail-body"></div>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <!-- ===== chrome.* shim（模拟 storage.local / runtime 消息路由） ===== -->
  <script>
    (function () {
      const listeners = { storage: [], message: [] };
      const mem = {};
      chrome = {
        storage: {
          local: {
            get: (keys, cb) => {
              const out = {};
              (Array.isArray(keys) ? keys : typeof keys === "string" ? [keys] : keys ? [] : Object.keys(mem)).forEach(
                (k) => { if (mem[k] !== undefined) out[k] = mem[k]; }
              );
              if (cb) setTimeout(() => cb(out), 0);
              return Promise.resolve(out);
            },
            set: (obj, cb) => {
              const changes = {};
              Object.keys(obj).forEach((k) => { changes[k] = { oldValue: mem[k], newValue: obj[k] }; mem[k] = obj[k]; });
              listeners.storage.forEach((l) => l(changes, "local"));
              if (cb) setTimeout(cb, 0);
              return Promise.resolve();
            },
            remove: (keys, cb) => {
              (Array.isArray(keys) ? keys : [keys]).forEach((k) => delete mem[k]);
              if (cb) setTimeout(cb, 0);
              return Promise.resolve();
            },
          },
          onChanged: { addListener: (l) => listeners.storage.push(l) },
        },
        runtime: {
          onMessage: { addListener: (l) => listeners.message.push(l) },
          // 模拟 background 的 DS_KB_SAVE / DS_KB_UNDO 路由（真实逻辑在 SW，此处等价复刻）
          sendMessage: (msg) =>
            new Promise((resolve) => {
              setTimeout(async () => {
                try {
                  if (msg.type === "DS_KB_SAVE") {
                    const p = msg.payload || {};
                    if (await kbIsDuplicate(p.sourceModel, p.plainText)) return resolve({ ok: true, duplicate: true });
                    await kbEnsureInbox();
                    const mediaList = (p.media || []).map((m) => ({
                      id: kbId("med"), mime: m.mime, dataUrl: m.dataUrl, thumb: m.thumb,
                    }));
                    const excerpt = {
                      id: kbId("ex"), title: p.title || "无标题", blocks: p.blocks || [],
                      plainText: p.plainText || "", mediaIds: mediaList.map((m) => m.id),
                      projectId: KB_INBOX_ID, tags: [], sourceModel: p.sourceModel || "",
                      sourceUrl: p.sourceUrl || "", createdAt: Date.now(), updatedAt: Date.now(),
                    };
                    await kbSaveExcerpt(excerpt, mediaList);
                    listeners.message.forEach((l) =>
                      l({ type: "DS_KB_CHANGED" }, {}, () => {})
                    );
                    return resolve({ ok: true, id: excerpt.id });
                  }
                  if (msg.type === "DS_KB_UNDO") {
                    const ex = await kbRemoveExcerpt(msg.id);
                    return resolve({ ok: !!ex });
                  }
                  resolve({ ok: false, error: "shim 未实现 " + msg.type });
                } catch (e) {
                  resolve({ ok: false, error: String(e) });
                }
              }, 0);
            }),
        },
      };
      window.__testMem = mem;
      window.__log = [];
      window.__testLog = (m) => { __log.push(m); console.info("[TEST]", m); };
    })();
  </script>
  <script src="../shared/kb-db.js"></script>
  <script src="/sidepanel/kb-ui.js"></script>
  <script>
    // ===== 自动化用例：由 preview_eval 驱动 =====
    window.__drive = async function () {
      const results = [];
      const assert = (name, cond) => {
        results.push((cond ? "PASS " : "FAIL ") + name);
        __testLog((cond ? "PASS " : "FAIL ") + name);
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // 1. 模拟 content script 静默保存（走 DS_KB_SAVE 等价路由）
      const r1 = await chrome.runtime.sendMessage({
        type: "DS_KB_SAVE",
        payload: {
          title: "什么是 MV3 Service Worker",
          blocks: [
            { t: "p", text: "MV3 用 service worker 替代 background page。" },
            { t: "code", lang: "js", text: "chrome.sidePanel.open({windowId})" },
          ],
          plainText: "MV3 用 service worker 替代 background page。",
          media: [{ mime: "image/png", dataUrl: tinyPng(), thumb: tinyPng() }],
          sourceModel: "ChatGPT",
          sourceUrl: "https://chatgpt.com/c/abc",
        },
      });
      assert("DS_KB_SAVE 返回 ok+id", r1.ok && !!r1.id);

      // 2. 去重：同内容再存一次 → duplicate
      const r2 = await chrome.runtime.sendMessage({
        type: "DS_KB_SAVE",
        payload: {
          title: "x", blocks: [], plainText: "MV3 用 service worker 替代 background page。",
          media: [], sourceModel: "ChatGPT", sourceUrl: "",
        },
      });
      assert("10 分钟内去重命中", r2.ok && r2.duplicate === true);

      // 3. 第二条不同内容
      const r3 = await chrome.runtime.sendMessage({
        type: "DS_KB_SAVE",
        payload: {
          title: "CSS spring 曲线", blocks: [{ t: "p", text: "cubic-bezier(0.34,1.56,0.64,1)" }],
          plainText: "cubic-bezier(0.34,1.56,0.64,1) 是 iOS 风格 spring 曲线", media: [],
          sourceModel: "Claude", sourceUrl: "",
        },
      });
      assert("第二条保存成功", r3.ok && !r3.duplicate);

      // 4. 打开知识库 → 收件箱 2 条
      document.getElementById("kb-btn").click();
      await sleep(120);
      assert("KB overlay 打开", document.getElementById("kb").classList.contains("show"));
      const cards = document.querySelectorAll("#kb-cards .kb-card");
      assert("收件箱显示 2 张卡片", cards.length === 2);

      // 5. 搜索过滤
      const si = document.getElementById("kb-search");
      si.value = "spring";
      si.dispatchEvent(new Event("input"));
      await sleep(220);
      assert("搜索 spring 命中 1 条", document.querySelectorAll("#kb-cards .kb-card").length === 1);
      si.value = "";
      si.dispatchEvent(new Event("input"));
      await sleep(220);

      // 6. 详情渲染（点含代码块/图片的卡片——排序最新的第一张可能只有文本）
      const richCard = [...document.querySelectorAll("#kb-cards .kb-card")]
        .find((c) => c.textContent.includes("什么是 MV3"));
      (richCard || document.querySelector("#kb-cards .kb-card")).click();
      await sleep(80);
      assert("详情层打开", document.getElementById("kb-detail").classList.contains("show"));
      const hasCode = !!document.querySelector("#kb-detail-body .kb-code");
      const hasImg = !!document.querySelector("#kb-detail-body .kb-img");
      assert("详情含代码块或图片渲染", hasCode || hasImg);
      document.getElementById("kb-detail-close").click();
      await sleep(60);
      assert("详情层关闭", !document.getElementById("kb-detail").classList.contains("show"));

      // 7. 新建项目并整理（移动第一条到新项目）
      const projCountBefore = document.querySelectorAll("#kb-projects .kb-proj").length;
      kbPutProject({ id: "pj_test1", name: "前端笔记", createdAt: Date.now(), updatedAt: Date.now(), color: "#34a853" });
      // 直接走 kb-ui 的移动逻辑等价操作：改 projectId + 刷新
      const allEx = await kbListExcerpts();
      const first = allEx.find((x) => x.title === "什么是 MV3 Service Worker");
      first.projectId = "pj_test1";
      await kbPutExcerpt(first);
      // 触发 DS_KB_CHANGED 刷新（shim 不自动发，手动模拟）
      document.getElementById("kb-close").click();
      await sleep(60);
      document.getElementById("kb-btn").click();
      await sleep(120);
      const projAfter = document.querySelectorAll("#kb-projects .kb-proj").length;
      assert("项目数增加（收件箱+前端笔记）", projAfter === projCountBefore + 1);
      assert("收件箱剩 1 条", document.querySelectorAll("#kb-cards .kb-card").length === 1);

      // 8. 删除 + 撤销（点卡片 hover 的 🗑）
      const before = document.querySelectorAll("#kb-cards .kb-card").length;
      const delBtn = document.querySelector("#kb-cards .kb-card .kb-card-ops button.danger");
      delBtn.click();
      await sleep(700); // removing 动画 + 重渲染
      assert("删除后卡片 -1", document.querySelectorAll("#kb-cards .kb-card").length === before - 1);
      // toast 上点撤销
      const undoBtn = [...document.querySelectorAll("#toast button")].find((b) => b.textContent === "撤销");
      assert("toast 出现撤销按钮", !!undoBtn);
      undoBtn.click();
      await sleep(250);
      assert("撤销后卡片恢复", document.querySelectorAll("#kb-cards .kb-card").length === before);

      // 9. 数据层：删项目 → 摘录移入收件箱
      await kbDeleteProjectDeep("pj_test1", false);
      const inboxCount = (await kbListExcerpts()).filter((x) => x.projectId === "inbox").length;
      assert("删项目后摘录回落收件箱", inboxCount === 2);

      // 10. 孤儿媒体回收
      const exs = await kbListExcerpts();
      await kbRemoveExcerpt(exs[0].id);
      const left = await kbListExcerpts();
      assert("删除摘录生效", left.length === 1);

      window.__results = results;
      return results;
    };
    function tinyPng() {
      return "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
    }
  </script>
