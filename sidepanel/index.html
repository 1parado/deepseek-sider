<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DeepSeek</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #fff;
      color: #1c1f23;
    }
    #chat-view {
      height: 100%;
      position: relative;
    }
    #chat-view iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="chat-view">
    <iframe src="https://chat.deepseek.com/" allow="clipboard-read; clipboard-write"></iframe>
  </div>
</body>
</html>
